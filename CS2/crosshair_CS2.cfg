echo ---------------------------------------------------------;
echo ---------------Crosshair Config for CS2------------------;
echo --------------------Version 2.2.0------------------------;
echo ---------------------------------------------------------;

//general Crosshair settings
crosshair true;
cl_crosshairalpha 255;
cl_crosshaircolor 1;
cl_crosshaircolor_b 0;
cl_crosshaircolor_r 0;
cl_crosshaircolor_g 255;
cl_crosshairdot true;
cl_crosshairgap 0;
cl_crosshairsize 2.5; //OLD
cl_crosshair_length 2;
cl_crosshairstyle 4;
cl_crosshairusealpha 1;
cl_crosshairthickness 2; //WAS 0.75
cl_fixedcrosshairgap 0;
cl_crosshairgap_useweaponvalue 0;
cl_crosshair_outlinethickness 0;
cl_crosshair_drawoutline 0;
cl_crosshair_friendly_warning 1;
cl_crosshair_recoil 1;
cl_crosshair_t false;
cl_ironsight_usecrosshaircolor true;

//grenade Crosshairs
cl_grenadecrosshair_decoy true;
cl_grenadecrosshair_explosive true
cl_grenadecrosshair_fire true
cl_grenadecrosshair_flash true
cl_grenadecrosshair_keepusercrosshair true
cl_grenadecrosshair_smoke true
cl_grenadecrosshairdelay_decoy 2.000000
cl_grenadecrosshairdelay_explosive 2.000000
cl_grenadecrosshairdelay_fire 2.000000
cl_grenadecrosshairdelay_flash 2.000000
cl_grenadecrosshairdelay_smoke 1.500000

//Sniper Scope settings
cl_sniper_delay_unscope false;
cl_crosshair_sniper_width 1;
cl_sniper_show_inaccuracy true;
cl_sniper_auto_rezoom true;

//Show all other crosshairs
cl_show_observer_crosshair 2;
cl_observed_bot_crosshair 1;


